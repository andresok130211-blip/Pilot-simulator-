name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "Pilot Sim" com.pilotsim.airliner --web-dir www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Постоянная подпись (чтобы APK ставился поверх старого)
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          sed -i '0,/^android {/s//android {\n    signingConfigs { debug { storeFile file("..\/..\/tools\/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }/' android/app/build.gradle
          grep -n "versionCode\|versionName\|signingConfigs\|storeFile" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pilot-sim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pilot-sim-apk
          path: pilot-sim.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pilot Sim (последний APK)
          files: pilot-sim.apk
