<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Pilot Sim — Пилот авиалайнера</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1220;color:#fff;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

/* ---------- органы управления в полёте ---------- */
#ui{position:fixed;inset:0;pointer-events:none;display:none}
#ui.on{display:block}
.ctl{pointer-events:auto;touch-action:none}
#thrw{position:absolute;bottom:12px;left:calc(8px + env(safe-area-inset-left));height:40%;min-height:120px;width:118px;display:flex;gap:6px;pointer-events:none}
#thrw .tl{position:relative;pointer-events:auto;touch-action:none;flex:1;height:calc(100% - 26px);border-radius:14px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);overflow:hidden}
#thrlink{position:absolute;left:0;right:0;bottom:0;height:22px;pointer-events:auto;touch-action:none;border:1px solid rgba(255,255,255,.45);background:rgba(20,30,55,.78);color:#fff;border-radius:8px;font-size:10px;font-weight:800}
#thrlink.on{background:#1f8f4e;border-color:#7dffb0}
#yoke{position:absolute;right:calc(8px + env(safe-area-inset-right));bottom:10px;width:min(150px,40vh);height:min(150px,40vh);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.06));border:2px solid rgba(255,255,255,.4);overflow:hidden}
#yoke svg{position:absolute;inset:6%;width:88%;height:88%;pointer-events:none}
#yoke .yl{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;font-weight:800;letter-spacing:1px;opacity:.8;pointer-events:none}
#thrw .tf{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffb347,#ff7a18)}
#thrw .lb{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;letter-spacing:1px;opacity:.95;z-index:2}
#thrw .tv{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:13px;font-weight:800;z-index:2}
#btns{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;width:min(580px,calc(100vw - 360px))}
#btns button{pointer-events:auto;touch-action:none;height:36px;border:1px solid rgba(255,255,255,.45);background:rgba(20,30,55,.78);color:#fff;border-radius:9px;font-size:10.5px;font-weight:800;padding:0 2px;line-height:1.05}
#btns button.on{background:#1f8f4e;border-color:#7dffb0}
#btns button.warn{background:#a23232;border-color:#ff9a9a}
#btns button:disabled{opacity:.4}
#quit{position:absolute;top:8px;right:calc(10px + env(safe-area-inset-right));width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(20,30,55,.7);color:#fff;font-size:15px;pointer-events:auto;z-index:3}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:46px;max-width:min(520px,60vw);text-align:center;font-size:14px;font-weight:800;color:#0b1220;background:rgba(141,255,180,.95);border-radius:10px;padding:5px 12px;display:none;pointer-events:none}
#log{position:absolute;left:calc(138px + env(safe-area-inset-left));bottom:62px;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;max-width:34vw}
#log div{margin-top:2px;background:rgba(6,12,26,.55);padding:2px 7px;border-radius:6px;width:fit-content}

/* ---------- экраны меню ---------- */
.screen{position:fixed;inset:0;display:none;overflow:hidden;touch-action:pan-y}
.screen.on{display:block}
.panel{position:absolute;top:0;bottom:0;right:0;width:min(440px,58vw);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px calc(14px + env(safe-area-inset-right)) 18px 14px;background:linear-gradient(90deg,rgba(6,12,26,.35),rgba(6,12,26,.9) 14%);touch-action:pan-y}
.panel.wide{width:min(720px,94vw);left:50%;right:auto;transform:translateX(-50%);background:rgba(6,12,26,.88);border-radius:0}
h1{font-size:23px;margin:4px 0 6px}
h2{font-size:16px;margin:12px 0 6px}
.row{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0}
.chip{background:rgba(255,255,255,.13);border-radius:18px;padding:5px 11px;font-size:12.5px;font-weight:600}
.sub{font-size:13px;opacity:.85;margin:5px 0;line-height:1.35}
.card{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:9px 11px;margin:7px 0}
.card.sel{border-color:#7dffb0;background:rgba(125,255,176,.14)}
.card .t{font-size:14.5px;font-weight:800}
.card .d{font-size:12px;opacity:.8;margin-top:2px;line-height:1.3}
.card .r{text-align:right;white-space:nowrap;font-size:13px;font-weight:800;color:#8dffb4}
.btn{background:#2f7df6;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:800}
.btn.g{background:rgba(255,255,255,.17)}
.btn.go{background:#1f9d57}
.btn.big{padding:13px 16px;font-size:16px;width:100%}
.btn:disabled{opacity:.45}
.mrow{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.mrow .btn{flex:1;min-width:120px}
label.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;line-height:1.3}
label.chk input{width:20px;height:20px;flex:none}
select{background:#16233d;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px;font-size:13px}
.stars{font-size:26px;letter-spacing:3px;color:#ffd24a}
table.res{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
table.res td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.12)}
table.res td:last-child{text-align:right;font-weight:700}
.pos{color:#8dffb4}.neg{color:#ff8a80}
.bar{position:sticky;bottom:-18px;margin:10px -14px -18px;padding:10px 14px 14px;background:linear-gradient(rgba(6,12,26,0),rgba(6,12,26,.97) 30%)}

#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20;touch-action:pan-y}
#modal.on{display:flex}
#modal .box{background:#10203a;border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:16px;max-width:min(560px,92vw);max-height:90vh;overflow:auto}

#rot{position:fixed;inset:0;background:#0b1220;display:none;z-index:50;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:700;padding:30px}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}

@media (max-height:430px){
  #btns button{height:32px;font-size:10px}
  #hint{top:42px;font-size:13px}
  h1{font-size:20px}
}
@media (max-width:640px){
  .panel{width:64vw}
}

#thrw .tm{position:absolute;left:0;right:0;bottom:35%;border-top:2px dashed rgba(255,255,255,.7);z-index:1;pointer-events:none}
#thrw .tm span{position:absolute;left:0;right:0;text-align:center;font-size:7.5px;font-weight:800;opacity:.85}
#thrw .tm span:first-child{bottom:2px}
#thrw .tm span:last-child{top:2px}

/* аварийные ситуации */
#evbox{position:absolute;top:48px;right:calc(10px + env(safe-area-inset-right));width:min(250px,34vw);display:flex;flex-direction:column;gap:6px;align-items:stretch;pointer-events:none}
#evp{display:none;background:rgba(40,6,6,.82);border:1.5px solid #ff5a4d;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.25;color:#fff}
#evp b{display:block;font-size:12.5px;color:#ff8a80;letter-spacing:.3px;margin-bottom:3px}
#evp div{margin-top:2px}
#evp .ok{color:#8dffb4}
#evp .no{color:#ffe08a}
#ebtns button{display:none;pointer-events:auto;touch-action:none;width:100%;height:40px;margin-top:4px;border-radius:10px;border:2px solid #ffb3ab;background:#b3261e;color:#fff;font-weight:900;font-size:13px;letter-spacing:.3px;animation:evpulse 1s infinite}
#ebtns button.show{display:block}
#eact button{pointer-events:auto;touch-action:none;display:block;width:100%;height:40px;margin-top:4px;border-radius:10px;border:2px solid #ffd9a0;background:#b3591e;color:#fff;font-weight:900;font-size:13px;letter-spacing:.3px;animation:evpulse 1s infinite}
@media (max-height:420px){#eact button{height:34px;font-size:12px}}
@keyframes evpulse{50%{filter:brightness(1.35)}}
#fade{position:absolute;inset:0;background:#000;color:#fff;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:800;pointer-events:none}
#bStart{position:absolute;left:50%;transform:translateX(-50%);top:92px;display:none;padding:10px 18px;border-radius:10px;border:0;background:#2ea36b;color:#fff;font-weight:800;font-size:15px;z-index:6}
#hint.alert{background:#ffb4ab;color:#3a0603}
.rank{margin:8px 0 2px}.rank .bar2{height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}.rank .bar2 i{display:block;height:100%;background:#7dffb0}
.evrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.evrow .ok{color:#8dffb4}.evrow .late{color:#ffe08a}.evrow .fail{color:#ff8a80}
@media (max-height:420px){#ebtns button{height:34px;font-size:12px}#evp{font-size:11px}}

#ebtns button.blue{background:#1d4f91;border-color:#9cc4ff;animation:none;height:34px;font-size:12px}
#ebtns button.blue.urgent{background:#b3261e;border-color:#ffb3ab;animation:evpulse 1s infinite}
#altp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,70vw);max-height:78vh;overflow:auto;background:rgba(8,16,34,.94);border:2px solid #9cc4ff;border-radius:14px;padding:10px;display:none;pointer-events:auto;z-index:4}
#altp.on{display:block}
#altp h3{margin:0 0 6px;font-size:14px}
#altp .it{display:flex;align-items:center;gap:10px;padding:7px 8px;margin-top:5px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
#altp .it.ok{border-color:#7dffb0;cursor:pointer}
#altp .it.no{opacity:.5}
#altp .it .ar{width:30px;text-align:center;font-size:20px;color:#ffd24a}
#altp .it .t{font-weight:800;font-size:13px}#altp .it .d{font-size:11.5px;opacity:.85}
#altp .cl{margin-top:8px;width:100%;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-weight:800}

#mapzone{position:absolute;display:none;border-radius:50%;pointer-events:auto;touch-action:none;z-index:2}
</style>
</head>

</div>

  ice: {

    steps(f, ev) {

    },

  wshear: {

  storm: {
    title: 'ГРОЗОВОЙ ФРОНТ', short: 'Гроза по курсу', phases: ['cruise'], weight: 2, group: 'wx', spawn: 'cruise',
    desc: 'По курсу грозовые очаги: молнии, болтанка, град. Включите ремни и обойдите грозу — кнопка ОБХОД.',
    ok: f => f.distM >= 300000,

    btns: (f, ev) => [...(ev.avoid ? [] : [{ k: 'avoid', t: '🌩 ОБХОД ГРОЗЫ' }]), ...(f.fx.belts ? [] : [{ k: 'belts', t: '🔔 РЕМНИ' }])],

      if (k === 'belts' && !f.fx.belts) { f.fx.belts = true; f.msg('Пассажиры пристёгнуты'); }
      if (k === 'avoid' && !ev.avoid) { ev.avoid = f.time; ev.avoidT = f.time - ev.t0; f.fuel = Math.max(0, f.fuel - f.p.burnHr * 0.02); f.msg('Обходим грозу — отклонение ≈ 25 км'); }
    },
    steps(f, ev) {
      return [
        { t: 'ОБХОД ГРОЗЫ — нажмите кнопку', done: !!ev.avoid },

    alert: (f, ev) => 'ГРОЗА ПО КУРСУ',
    tick(f, ev, dt) {
      if (f.rnd() < dt * 0.7) f.fx.flash = 1;
      if (ev.avoid) {
        f.fx.turb = Math.max(0, f.fx.turb - dt / 10);
        if (f.fx.turb <= 0.02) { f.fx.turb = 0; f.fx.belts = false; f.resolveEvent(ev, ev.avoidT < 35 ? 'ok' : 'late', 'Гроза обойдена'); }
      } else if (f.time - ev.t0 > ev.dur) { f.fx.turb = 0; f.fx.belts = false; f.resolveEvent(ev, 'late', 'Прошли сквозь грозовой фронт'); }
    },
  },

  fog: {
    title: 'ПЛОХАЯ ВИДИМОСТЬ / ТУМАН', short: 'Туман: видимость ниже минимума', phases: ['descent'], weight: 2, group: 'land', spawn: 'descent',

        { t: 'На ВПР (60 м) полосы нет — УХОД; или сразу на запасной: ' + f.altText(), done: f.gaCount > 0 || f.ga || f.diverted },

    },
    alert: (f, ev) => !f.td && !f.ga && f.h < 70 && f.dist > 0 && f.dist < 6000 ? 'ВПР: ПОЛОСЫ НЕ ВИДНО — УХОД!' : null,

      if (f.td) { f.incident('fog', 'Посадка ниже минимума видимости', 10, 999); f.resolveEvent(ev, 'fail', 'Посадка вслепую вопреки минимуму'); }

  cabinFire: {
    title: 'ПОЖАР В САЛОНЕ / БАГАЖНИКЕ', short: 'Пожар в салоне или багажнике', phases: ['cruise'], weight: 2, group: 'pax', spawn: 'cruise',
    desc: 'Дым и огонь на борту. Тушите, быстро снижайтесь ниже 3000 м и садитесь на ближайшем аэродроме — времени мало.',
    ok: f => f.distM >= 250000,
    start(f, ev) {
      ev.res = f.rnd() < 0.65; ev.where = f.rnd() < 0.5 ? 'салоне' : 'грузовом отсеке'; f.fx.smoke = 0.15;
      f.msg('ПОЖАР В ' + (ev.where === 'салоне' ? 'САЛОНЕ' : 'ГРУЗОВОМ ОТСЕКЕ') + '! Дым в кабине');
    },
    btns: (f, ev) => ev.ext ? [] : [{ k: 'ext', t: '🧯 ТУШЕНИЕ' }],
    act(f, ev, k) {
      if (k !== 'ext' || ev.ext) return;
      ev.ext = f.time; const c = f.c;
      f.msg(ev.res ? 'Очаг потушен, но дым остаётся — садитесь' : 'Огонь не гаснет! СРОЧНО НА ПОСАДКУ');
      if (f.apLock <= 0) { c.apOn = true; c.atOn = f.atLock <= 0; c.appr = false; }
      c.apAlt = Math.min(c.apAlt, 3000);
    },
    steps(f, ev) {
      return [
        { t: 'ТУШЕНИЕ — нажмите кнопку (пожар в ' + ev.where + ')', done: !!ev.ext },
        { t: 'Снизьтесь ниже 3000 м (сейчас ' + Math.round(f.h) + ' м)', done: f.h < 3100 },
        { t: 'Срочная посадка: ' + f.altText(), done: f.diverted || f.dist < 100000 },
      ];
    },
    alert: (f, ev) => ['ДЫМ В КАБИНЕ', ...(ev.ext && !ev.res ? ['ОГОНЬ НЕ ПОТУШЕН'] : [])],
    tick(f, ev, dt) {
      const age = f.time - ev.t0;
      ev.needDiv = !!ev.ext;
      f.fx.smoke = ev.ext ? (ev.res ? 0.4 : 0.8) : Math.min(0.9, 0.15 + age * 0.006);
      if (!ev.ext && age > 90 && !ev.spread) { ev.spread = true; f.incident('cfire', 'Пожар не тушили вовремя', 10, 999); }
      if (age > 480 && !f.diverted && f.dist > 100000) { f.finish('crash', 'Пожар на борту: самолёт потерян.'); return; }
      if (f.td) { f.resolveEvent(ev, 'late', 'Посадка с пожаром на борту'); return; }
      if (settled(f, ev, dt, 3)) f.resolveEvent(ev, age > 260 ? 'late' : 'ok', 'Пожар локализован, идём на посадку');
    },

  medical: {
    title: 'МЕДИЦИНСКАЯ ПРОБЛЕМА НА БОРТУ', short: 'Медицинская проблема на борту', phases: ['cruise'], weight: 2, group: 'pax', spawn: 'cruise',

      if (k !== 'doc' || ev.asked) return;
      ev.asked = f.time;
      ev.needDiv = !ev.doc || ev.crit;

    steps(f, ev) {

      return s;
    },
    alert: (f, ev) => 'МЕДИЦИНСКАЯ ПРОБЛЕМА',
    tick(f, ev, dt) {
      const age = f.time - ev.t0;
      if (ev.asked && !ev.needDiv && f.time - ev.asked > 8) f.resolveEvent(ev, ev.asked - ev.t0 < 60 ? 'ok' : 'late', 'Пассажир стабилен, продолжаем рейс');
      else if (ev.needDiv && (f.diverted || f.dist < 150000)) f.resolveEvent(ev, age > 300 ? 'late' : 'ok', 'Идём на посадку — скорая встретит на полосе');
      else if (ev.needDiv && age > 500) { f.incident('med', 'Состояние пассажира критическое', 12, 999); f.resolveEvent(ev, 'fail', 'Слишком поздно...'); }
      else if (!ev.asked && age > 150) { f.incident('med', 'Не запросили врача вовремя', 6, 999); f.resolveEvent(ev, 'fail', 'Помощь оказана слишком поздно'); }
    },

  unruly: {
    title: 'ДЕБОШИР / УГРОЗА БЕЗОПАСНОСТИ', short: 'Дебошир или угроза безопасности', phases: ['cruise'], weight: 2, group: 'pax', spawn: 'cruise',
    desc: 'В салоне агрессивный пассажир. Заприте дверь кабины, дайте сигнал тревоги; при серьёзной угрозе — садитесь на ближайшем аэродроме.',
    ok: f => f.distM >= 250000,
    start(f, ev) { ev.sev = f.rnd() < 0.45; f.msg(ev.sev ? 'УГРОЗА БЕЗОПАСНОСТИ: пассажир рвётся в кабину!' : 'ПАССАЖИР-ДЕБОШИР в салоне!'); },
    btns: (f, ev) => [...(ev.door ? [] : [{ k: 'door', t: '🔒 ЗАПЕРЕТЬ КАБИНУ' }]), ...(ev.alarm ? [] : [{ k: 'alarm', t: '🚨 ТРЕВОГА 7500' }])],
    act(f, ev, k) {
      if (k === 'door' && !ev.door) { ev.door = f.time; f.msg('Дверь кабины заперта'); }
      if (k === 'alarm' && !ev.alarm) { ev.alarm = f.time; f.msg('Сигнал тревоги передан, экипаж салона действует'); }
    },
    steps(f, ev) {
      const s = [{ t: 'ЗАПЕРЕТЬ КАБИНУ — кнопка', done: !!ev.door }, { t: 'ТРЕВОГА 7500 — сообщить диспетчеру', done: !!ev.alarm }];
      if (ev.sev) s.push({ t: 'Серьёзная угроза: садитесь на ближайшем аэродроме — ' + f.altText(), done: f.diverted || f.dist < 120000 });
      return s;
    },
    alert: (f, ev) => ev.sev ? 'УГРОЗА БЕЗОПАСНОСТИ' : 'ДЕБОШИР В САЛОНЕ',
    tick(f, ev, dt) {
      const age = f.time - ev.t0;
      ev.needDiv = !!ev.sev && !!ev.door && !!ev.alarm;
      if (!ev.door && age > 40 && !ev.warned) { ev.warned = true; f.incident('door', 'Дверь кабины не заперта вовремя', 8, 999); }
      if (ev.sev && age > 360 && !f.diverted && f.dist > 120000) { f.resolveEvent(ev, 'fail', 'Угрозу не удалось купировать'); f.incident('threat', 'Игнорирование угрозы безопасности', 12, 999); return; }
      if (ev.door && ev.alarm) {
        if (!ev.sev && f.time - Math.max(ev.door, ev.alarm) > 25) f.resolveEvent(ev, age > 90 ? 'late' : 'ok', 'Дебошир усмирён экипажем');
        else if (ev.sev && (f.diverted || f.dist < 120000)) f.resolveEvent(ev, age > 240 ? 'late' : 'ok', 'Идём на посадку, полиция встретит у трапа');
      } else if (!ev.sev && age > 150) f.resolveEvent(ev, 'late', 'Экипаж справился без вашей помощи');
    },
  },

  tcas: {
    title: 'КОНФЛИКТ С ДРУГИМ БОРТОМ (TCAS)', short: 'Конфликт с бортом (TCAS)', phases: ['cruise'], weight: 2, spawn: 'cruise',
    desc: 'Встречный борт на вашем эшелоне. TCAS даёт команду: вверх или вниз. Выполняйте немедленно вертикальной скоростью ≥ 6 м/с.',
    ok: f => f.distM >= 250000,
    extra: f => Math.abs(f.vs) < 2.5 && f.h > 4000,
    start(f, ev) {
      ev.ra = (f.h > f.ceilLim - 700 || f.rnd() < 0.5) ? -1 : 1;
      ev.hAc = f.h - ev.ra * 50;
      f.fx.traffic = { d: 8000, dh: ev.hAc - f.h, ra: 0 };
      f.msg('ТРАФИК! ТРАФИК!');
    },
    steps(f, ev) {
      const raOn = f.time - ev.t0 > 3;
      return [
        { t: 'Встречный борт ' + Math.round(Math.max(0, f.fx.traffic ? f.fx.traffic.d : 0) / 100) / 10 + ' км, на том же эшелоне', done: raOn },
        ...(raOn ? [{ t: 'TCAS: ' + (ev.ra > 0 ? 'ВВЕРХ (А/П: ВЫС +)' : 'ВНИЗ (А/П: ВЫС −)') + ' — вертикальная ≥ 6 м/с', done: f.vs * ev.ra > 5 }] : []),
      ];
    },
    alert: (f, ev) => f.time - ev.t0 > 3 ? (ev.ra > 0 ? 'TCAS: КЛИМБ! КЛИМБ!' : 'TCAS: СНИЖАЙСЯ! СНИЖАЙСЯ!') : 'TCAS: ТРАФИК',
    tick(f, ev, dt) {
      const age = f.time - ev.t0, tr = f.fx.traffic;
      if (tr) { tr.d = 8000 - 400 * age; tr.dh = ev.hAc - f.h; tr.ra = age > 3 ? ev.ra : 0; }
      if (age > 6 && !ev.auto && f.assist.auto && f.c.apOn && f.apLock <= 0) { ev.auto = true; f.c.apAlt = Math.max(300, Math.min(f.ceilLim - 250, f.h + ev.ra * 500)); f.msg('А/П выполняет команду TCAS'); }
      if (age >= 20) {
        const sep = Math.abs(f.h - ev.hAc); f.fx.traffic = null;
        if (sep >= 120) f.resolveEvent(ev, 'ok', 'Разошлись безопасно (' + Math.round(sep) + ' м по вертикали)');
        else if (sep >= 70) { f.incident('tcas', 'Опасное сближение с бортом', 4, 999); f.resolveEvent(ev, 'late', 'Разошлись впритык (' + Math.round(sep) + ' м)'); }
        else { f.incident('nmac', 'Опасное сближение (NMAC)', 15, 999); f.resolveEvent(ev, 'fail', 'Чудом разошлись: ' + Math.round(sep) + ' м'); }
      }
    },
  },

    steps(f, ev) {

        { t: 'Держите линию пути: снос ' + Math.round(Math.abs(f.yPos)) + ' м', done: Math.abs(f.yPos) < 3000 },

    if (fx.smoke > 0 && !(this.ev && this.ev.id === 'cabinFire')) fx.smoke = Math.max(0, fx.smoke - dt / 60);
    if (fx.flash > 0) fx.flash = Math.max(0, fx.flash - dt * 3);
    if (this.onGround) {
      if (fx.tire && !this.airborneOnce && this.v > 3) this.psi += fx.tire * 0.05 * dt * Math.min(1, this.v / 20);
      return;
    }
    if (fx.turb > 0) {
      const n = Math.sin(1.9 * t) * 0.6 + Math.sin(3.3 * t + 1.3) * 0.4, n2 = Math.sin(1.3 * t + 2) * 0.6 + Math.sin(2.9 * t) * 0.4, n3 = Math.sin(2.3 * t + 0.5);
      this.gamma += fx.turb * 0.03 * dt * n;
      this.phi += fx.turb * 4 * DEG * dt * n2;
      this.v = Math.max(5, this.v + fx.turb * 4 * n3 * dt);
      if (!fx.belts) { fx.injT = (fx.injT || 0) + dt * fx.turb; if (fx.injT > 25 && !fx.injDone) { fx.injDone = true; this.incident('belts', 'Пассажиры без ремней получили травмы', 8, 999); } }
    }
    if (fx.ws > 0) { fx.ws -= dt; this.v = Math.max(8, this.v - 1.6 * dt); this.h -= 5 * dt; }
    if (fx.gps) this.yPos += 3.5 * dt * (fx.gpsDir || 1);
  }
  evAction(k) {
    const ev = this.ev; if (!ev || this.done) return;
    const d = EVENT_DEFS[ev.id]; if (d.act) d.act(this, ev, k);
  }
  evBtns() {
    const ev = this.ev; if (!ev || this.done) return [];
    const d = EVENT_DEFS[ev.id]; return d.btns ? d.btns(this, ev) : [];
  }

  stepGround(dt, T) {
    const c = this.c, W = this.mass * G;
    const N = Math.max(0, W - this.L);
    const onRwy = this.onRunway(this.x);
    const paved = !this.taxiOps || this.onPaved();
    // режим руления: малая скорость и газ в нижней трети ползунка — ползунок задаёт скорость руления
    const taxiMode = this.taxiOps && this.v < 24 && c.thr < 0.35;
    if (taxiMode) {
      let vt = c.taxiAuto && !(this.td && !this.td.onDest) ? this.autoV : c.thr / 0.35 * 15;
      if (!paved) vt = Math.min(vt, 6);
      let a = c.brake ? -2.6 : clamp((vt - this.v) * 0.7, -1.8, 1.0);
      if (this.gearPos < 0.9) a = Math.min(a, -1);
      this.v = Math.max(0, this.v + a * dt);
      if (this.v < 0.05 && vt < 0.2) this.v = 0;
    } else {
      let mu = paved ? 0.02 : 0.15;
      if (this.gearPos < 0.9) mu = 0.5;
      if (!c.brake && this.td && c.abrk > 0 && this.v > 3) mu += [0.08, 0.14, 0.22][c.abrk - 1] * (this.fx.slick ? 0.55 : this.wxNow.rain > 0.3 ? 0.8 : 1);
      if (c.brake) mu += onRwy ? (this.fx.slick ? 0.15 : this.wxNow.rain > 0.3 ? 0.24 : 0.30) : 0.2;
      let F = T - this.Dr - mu * N;
      if (this.v < 0.3 && F <= 0) { this.v = 0; }
      else {
        this.v += F / this.mass * dt;
        if (this.v < 0) this.v = 0;
      }
    }
    const steer = this.taxiOps && c.taxiAuto && !(this.td && !this.td.onDest) ? this.autoSteer : (c.roll || 0);
    if (this.taxiOps) {
      if (this.v > 0.8) {
        const sc = Math.abs(steer) > 0.04 ? steer : 0;
        this.psi += sc * Math.min(this.v / 12, 0.7) * (this.v > 30 ? Math.pow(30 / this.v, 2) : 1) * dt;
        if (!sc && onRwy && this.v > 12 && Math.abs(this.psi) < 0.6) this.psi -= this.psi * 0.6 * dt;
      }
    } else if (this.v > 1) {
      if (Math.abs(steer) > 0.04) this.psi += steer * 0.25 * Math.min(1, 25 / Math.max(this.v, 5)) * dt;
      else this.psi -= this.psi * 0.6 * dt;
    }
    if (this.asym && this.v > 3 && !(this.taxiOps && c.taxiAuto)) this.psi -= this.asym * 0.06 * Math.min(1, this.v / 20) * (this.assist.auto ? 0.35 : 1) * dt;
    if (this.fx.slick && this.v > 25) this.psi += this.fx.slick * 0.02 * Math.sin(this.time * 0.8) * dt;
    if (this.v > 20 && (this.wl.x || this.wl.z)) this.psi -= this.wl.z * 0.0015 * clamp((this.v - 20) / 20, 0, 1) * (this.assist.auto ? 0.3 : 1) * dt;
    this.psi = wrapPi(this.psi);
    this.x += (this.v * Math.cos(this.psi) + (this.v > 20 ? this.wl.x * clamp((this.v - 20) / 15, 0, 1) : 0)) * dt;
    this.yPos += this.v * Math.sin(this.psi) * dt;
    this.gamma = 0; this.h = 0;
    if (this.taxiOps) {
      if (!paved && this.v > 8) this.incident('grass', 'Выезд на траву', 3, 30);
      if (paved && !onRwy && this.v > 20) this.incident('taxispeed', 'Превышение скорости руления', 2, 30);
      for (const f of [this.fr0, this.fr1]) {
        const ax = this.x - f.x0;
        if (this.yPos > 238 && ax > f.len * 0.28 && ax < f.len * 0.65 && this.v > 1) { this.finish('crash', 'Столкновение с терминалом.'); return; }
      }
    }
    // отрыв
    if (!this.td && this.v > 25 && this.L >= W && this.theta > 1.5 * DEG && this.gearPos > 0.5 && (!this.taxiOps || onRwy)) {
      this.onGround = false; this.airborneOnce = true; this.gamma = 0.0; this.h = 0.05;
      this.msg('Отрыв! Скорость ' + Math.round(this.ias * 3.6) + ' км/ч');
      return;
    }
    // заход в траву
    if (!onRwy && this.v > 30 && !this.td && (this.x > this.rwy0.e || Math.abs(this.yPos) > 32)) { this.finish('crash', Math.abs(this.yPos) > 32 ? 'Самолёт выкатился с боковой стороны полосы при взлёте.' : 'Самолёт выкатился за конец полосы при взлёте.'); return; }
    if (!onRwy && this.td && this.v > 25) { this.finish('crash', Math.abs(this.yPos) > 32 ? 'Самолёт выкатился с боковой стороны полосы.' : this.x > this.rwy1.e ? 'Самолёт выкатился за пределы полосы на большой скорости.' : 'Посадка вне полосы на большой скорости.'); return; }
    // автотормоз после касания
    if (this.td && this.assist.auto && this.v > 8 && !(this.taxiOps && c.taxiAuto && this.v < 24)) {
      c.brake = true; c.atOn = false; c.split = false;
      const autoRev = this.eng[0] > 0.9 && this.eng[1] > 0.9 && this.v > 32 && this.td.onDest;
      c.rev = autoRev; c.thr = c.t1 = c.t2 = autoRev ? 0.6 : 0;
    }
    // конец пробега
    if (this.v > this.maxV) this.maxV = this.v;
    if (this.td && this.v < 0.6 && this.time - this.td.t > 2) {
      const onDest = this.x >= this.rwy1.s - 20 && this.x <= this.rwy1.e + 20 && Math.abs(this.yPos) <= 35;
      if (this.x > this.rwy1.e && Math.abs(this.yPos) < 50) this.finish('overrun', 'Самолёт остановился за пределами полосы.');
      else if (this.taxiOps && this.td.onDest) { /* продолжаем руление до гейта */ }
      else if (onDest) this.finish('ok', '');
      else if (this.x <= this.rwy0.e + 20) this.finish('forced', 'Вынужденная посадка в аэропорту вылета. Рейс отменён.');
      else this.finish('forced', 'Остановились вне полосы назначения.');
    }
    // прерванный взлёт
    if (!this.td && !this.airborneOnce && this.maxV > 25 && this.v < 0.5) this.finish('abort', 'Взлёт прекращён.');
  }

  onRunway(x, y = this.yPos) {
    if (Math.abs(y) > 32) return false;
    return (x >= this.rwy0.s - 5 && x <= this.rwy0.e) || (x >= this.rwy1.s - 5 && x <= this.rwy1.e);
  }

  stepAir(dt, T) {
    const v = Math.max(this.v, 12), m = this.mass;
    const al = this.alpha, ca = Math.cos(al), sa = Math.sin(al);
    const dv = ((T * ca - this.Dr) / m - G * Math.sin(this.gamma)) * dt;
    const dg = ((this.L * Math.cos(this.phi) + T * sa) / (m * v) - G * Math.cos(this.gamma) / v) * dt;
    if (this.v > 20) this.psi = wrapPi(this.psi + G * Math.tan(this.phi) / this.v * dt - this.asym * 0.012 * (c0apOn(this) ? 0.1 : this.assist.auto ? 0.4 : 1) * dt);
    this.v = Math.max(5, this.v + dv);
    this.gamma = clamp(this.gamma + dg, -1.2, 1.2);
    this.x += (this.v * Math.cos(this.gamma) * Math.cos(this.psi) + this.wl.x) * dt;
    this.yPos += (this.v * Math.cos(this.gamma) * Math.sin(this.psi) + this.wl.z) * dt;
    this.h += this.v * Math.sin(this.gamma) * dt;
    // перегрузка
    const n = this.L / (m * G);
    this.nz = n;
    if (n > this.stats.maxG) this.stats.maxG = n;
    if (this.h < 1500 && this.h > 0.5 && this.airborneOnce && terrainAt(this, this.x, this.yPos) > this.h + 3) { this.finish('crash', 'Столкновение с землёй: самолёт врезался в гору.'); return; }
    if (this.h <= 0 && this.gamma <= 0.02) this.touchdown();
    else if (this.h < 0) this.h = 0;
    // пролетели
    if (!this.done && this.x > this.rwy1.e + 20000 && Math.hypot(this.x - this.D, this.yPos) > 40000) this.finish('missed', 'Вы пролетели аэропорт назначения.');
    if (!this.done && Math.abs(this.yPos) > 70000) this.finish('missed', 'Вы слишком далеко ушли от маршрута.');
  }

  touchdown() {
    const sink = -this.v * Math.sin(this.gamma);
    const tdx = this.x; this.marks.push({ i: this.track.length, text: 'Касание' });
    this.h = 0;
    const lat = Math.abs(this.yPos);
    const onDest = tdx >= this.rwy1.s - 10 && tdx <= this.rwy1.e && lat <= 32;
    const onOrig = tdx >= this.rwy0.s && tdx <= this.rwy0.e && lat <= 32;
    const ias = this.ias;
    if (this.gearPos < 0.85) { this.finish('crash', 'Посадка с невыпущенным шасси.'); return; }
    if (this.rwyBlocked && onDest) { this.finish('crash', 'Столкновение с техникой на полосе при посадке.'); return; }
    if (!onDest && !onOrig && this.v > 35) {
      this.finish('crash', lat > 32 ? 'Приземление рядом с полосой: слишком большое боковое отклонение.' : tdx < this.rwy1.s ? 'Недолёт: самолёт приземлился до полосы.' : 'Приземление за пределами полосы.');
      return;
    }
    if (Math.abs(this.phi) > 12 * DEG) { this.finish('crash', 'Касание крылом: слишком большой крен при посадке.'); return; }
    if (Math.abs(this.psi) > 15 * DEG) { this.finish('crash', 'Боковой снос: самолёт приземлился не вдоль полосы.'); return; }
    if (sink > 5.5) { this.finish('crash', 'Слишком жёсткое приземление (' + sink.toFixed(1) + ' м/с): конструкция разрушена.'); return; }
    if (ias * 3.6 > 400) { this.finish('crash', 'Слишком высокая скорость при посадке.'); return; }
    this.onGround = true; this.gamma = 0;
    this.td = { t: this.time, sink: Math.max(0, sink), v: this.v, ias, pitch: this.theta / DEG, x: tdx, onDest, onOrig, past: tdx - this.rwy1.s, lat };
    this.phi = 0;
    if (lat > 12) this.incident('lat', 'Касание не по оси полосы', 2, 999);
    if (this.theta < 0.3 * DEG) this.incident('nose', 'Касание носовой стойкой', 4, 999);
    if (this.theta > 11.7 * DEG && !this.stats.tail) { this.stats.tail = true; this.incident('tail', 'Касание хвостом', 6, 999); }
    if (sink > 3.4) this.incident('hard', 'Жёсткая посадка', 0, 999);
    this.msg(onOrig && !onDest ? 'Вынужденная посадка на аэродроме вылета' : 'Касание: ' + sink.toFixed(1) + ' м/с');
    // вынужденная посадка в аэропорту вылета — сразу завершить рейс после остановки
  }

  updateWarnings(dt) {
    const w = this.warnings;
    const set = (k, on) => { if (on) w.add(k); else w.delete(k); };
    const A = this.A, ias = this.ias;
    set('stall', this.stallWarn);
    if (this.stalled) { this.stats.stallT += dt; this.incident('stall', 'Сваливание', 5, 25); }
    const over = this.mach > this.p.cruiseM + 0.045 || ias > 175;
    set('over', over);
    if (over) { this.stats.overT += dt; if (this.stats.overT > 3) this.incident('over', 'Превышение скорости', 4, 40); }
    const sinkRate = this.vs;
    set('sink', !this.onGround && this.h < 300 && sinkRate < -9 && this.dist < 30000);
    set('pullup', !this.onGround && this.h < 80 && sinkRate < -11);
    set('gear', !this.onGround && this.h < 250 && this.dist < 8000 && this.dist > 0 && !this.c.gear);
    set('flaps', !this.onGround && this.h < 250 && this.dist < 6000 && this.dist > 0 && this.c.flaps < 3 && this.c.gear && !this.hyd);
    this._tw -= dt;
    if (this._tw <= 0) {
      this._tw = 0.5; let th = false;
      if (!this.onGround && this.airborneOnce && this.h < 1800 && !this.ga) {
        const cp = Math.cos(this.psi), sp = Math.sin(this.psi);
        for (const k of [1200, 2600, 4500]) { if (terrainAt(this, this.x + k * cp, this.yPos + k * sp) > this.h - 120 + (this.vs < -2 ? -this.vs * k / Math.max(this.v, 60) * 0.5 : 0)) { th = true; break; } }
      }
      this._terrWarn = th;
    }
    set('terrain', this._terrWarn);
    set('lowfuel', this.fuel < this.p.burnHr * 0.3 && this.fuel > 0);
    if (w.has('sink') || w.has('pullup')) { this.stats.gpws += dt; this.incident('sink', 'Опасная скорость снижения', 3, 30); }
    if (this.fuel <= 0 && this.Tavail === 0) set('fuel0', true);
  }

  finish(kind, reason) {
    if (this.done) return;
    this.done = true;
    this.result = { kind, reason };
    this.closeEvents(kind);
    this.c.brake = true;
  }

  // ---------- ускорение времени ----------
  allowedWarp() {
    const c = this.c;
    if (this.ev || this.fade > 0 || this.ga || this.rwyBlocked || this.hold || !this.clrTo) return 1;
    if (this.onGround) return this.taxiOps && c.taxiAuto && !this.warnings.size && this.v > 0.5 && !(this.td && !this.td.onDest) ? 4 : 1;
    if (!c.apOn || !c.atOn || this.warnings.size) return 1;
    if (Math.abs(c.roll || 0) > 0.04 || Math.abs(this.phi) > 6 * DEG) return 1;
    if (!c.nav && Math.abs(this.yPos) > 800) return 1;
    const dist = this.dist;
    // заход по глиссаде: если всё делает автоматика, можно слегка ускорить
    if (this.apprCap) {
      if (!(this.assist.auto && this.assist.config) || this.h < 400 || dist < 9000) return 1;
      return dist > 16000 ? 4 : 2;
    }
    if (this.h < 250) return 1;
    if (this.h < 700) return dist > 60000 ? 2 : 1;
    // без помощника по механизации игроку нужно время на закрылки — ускорение выключаем раньше
    if (dist < (this.assist.config ? 34000 : 50000)) return 1;
    let w = (dist - (this.assist.config ? 30000 : 45000)) / (Math.max(this.v, 100) * (this.assist.config ? 20 : 40));
    let r = 1; for (const k of [2, 4, 8, 16, 32]) if (w >= k) r = k;
    return r;
  }
  effectiveWarp() { return Math.min(Math.max(1, this.c.warp), this.allowedWarp()); }

  update(frameDt) {
    const w = this.effectiveWarp();
    this.acc += Math.min(frameDt, 0.05) * 60 * w;
    let n = Math.floor(this.acc); this.acc -= n;
    n = Math.min(n, 80);
    for (let i = 0; i < n && !this.done; i++) this.step(1 / 60);
    return w;
  }

  // ---------- аварийные ситуации ----------
  startEvent(id, o) {
    const d = EVENT_DEFS[id];
    const ev = { id, t0: this.time, okT: 0 };
    this.ev = ev; this.marks.push({ i: this.track.length, text: d.short });
    d.start(this, ev, o);
    return ev;
  }
  resolveEvent(ev, outcome, text) {
    if (!ev || ev.done) return;
    ev.done = true;
    this.evLog.push({ id: ev.id, outcome, title: EVENT_DEFS[ev.id].short });
    if (this.ev === ev) this.ev = null;
    if (text) this.msg(text);
  }
  closeEvents(kind) {
    const ev = this.ev; if (!ev) return;
    let out = kind === 'crash' || kind === 'overrun' ? 'fail' : 'late';
    if (ev.id === 'engRoll' && kind === 'abort') out = 'ok';
    if (this.diverted && kind === 'ok' && ev.id !== 'runway') out = 'ok';
    if (ev.id === 'runway' && this.gaCount === 0 && kind === 'ok') out = 'fail';
    const d = EVENT_DEFS[ev.id]; if (d.close) out = d.close(this, ev, kind, out);
    this.resolveEvent(ev, out, '');
  }
  evStep(dt) {
    if (this.fade > 0) this.fade = Math.max(0, this.fade - dt * 0.5);
    const c = this.c;
    if (this.apLock > 0) { this.apLock -= dt; c.apOn = false; c.appr = false; this.apprCap = false; if (this.apLock <= 0 && this.assist.auto) { c.apOn = true; c.atOn = c.atOn || this.atLock <= 0; } }
    if (this.atLock > 0) { this.atLock -= dt; c.atOn = false; if (this.atLock <= 0 && this.assist.auto) c.atOn = true; }
    if ((this.engCount < 2 || this.fx.noRetract) && c.apOn && c.apAlt > this.ceilLim - 250) c.apAlt = this.ceilLim - 250;
    if (this.ga) this.gaStep(dt);
    if (this.ev) EVENT_DEFS[this.ev.id].tick(this, this.ev, dt);
    else if (!this.done && this.evq) { for (const q of this.evq) if (!q.fired && evWhen(this, q)) { q.fired = true; this.startEvent(q.id, q.o); break; } }
    const a = this.alerts; a.clear();
    if (this.fire && !this.fire.ext) a.add('ПОЖАР ДВИГАТЕЛЯ №' + (this.fire.side + 1));
    if (this.decomp && this.ev && this.ev.id === 'decomp') a.add('РАЗГЕРМЕТИЗАЦИЯ');
    if (this.rwyBlocked && !this.td) a.add('ПОЛОСА ЗАНЯТА — УХОД!');
    if (this.hyd) a.add('ОТКАЗ ГИДРАВЛИКИ');
    if (this.apLock > 0) a.add('ОТКАЗ АВТОПИЛОТА');
    if (this.atLock > 0) a.add('ОТКАЗ АВТОМАТА ТЯГИ');
    if (this.ev) { const al = EVENT_DEFS[this.ev.id].alert; if (al) { const x = al(this, this.ev); if (x) for (const y of [].concat(x)) a.add(y); } }
    if (this.imb > 600 && !this.xfeed) a.add('ДИСБАЛАНС ТОПЛИВА — ПЕРЕКАЧКА');
    if (this.engCount < 2 && !this.cold && !(this.fire && !this.fire.ext)) a.add(this.engCount ? 'ДВИГАТЕЛЬ ' + (this.eng[0] < 0.01 ? 1 : 2) + ' — ОТКАЗ' : 'ОБА ДВИГАТЕЛЯ ОТКАЗАЛИ');
  }
  // ---------- запасные аэродромы ----------
  altList() {
    const out = [], p = this.p;
    for (const w of this.world) {
      if (w.id === this.toAp.id && !this.diverted) continue;
      if (this.diverted && w.id === this.divTo) continue;
      const l = toLocal(this.tf, w.wx, w.wz, { x: 0, z: 0 });
      const dx = l.x - this.x, dz = l.z - this.yPos, d = Math.hypot(dx, dz);
      if (d > 520000) continue;
      const rel0 = Math.abs(wrapPi(Math.atan2(dz, dx) - this.psi));
      const need = 8000 + 0.8 * (Math.max(0, this.h - 3000) / 9 * 190 + 81000 * Math.min(1, this.h / 3000)) + (rel0 > 1.4 ? 50000 : rel0 > 0.7 ? 15000 : 0);
      let ok = true, why = '';
      if (w.len < p.minRwy) { ok = false; why = 'полоса коротка'; }
      else if (d < need) { ok = false; why = 'слишком близко/высоко'; }
      else if (this.onGround || this.ga) { ok = false; why = ''; }
      out.push({ w, d, ok, why, lx: l.x, lz: l.z, rel: Math.atan2(dz, dx) - this.psi, label: w.gen ? w.ap.city : w.ap.city + ' (' + w.id + ')' });
    }
    out.sort((a, b) => (b.ok - a.ok) || (a.d - b.d));
    return out;
  }
  altText() { const a = this.altList().find(x => x.ok); return a ? a.label + ' — ' + Math.round(a.d / 1000) + ' км' : 'недоступен'; }
  divertTo(w) {

    case 'map': view.map = view.map === false; break;

  $('mQuit').onclick = () => { paused = false; hideModal(); flight.finish(flight.airborneOnce ? 'forced' : 'abort', flight.airborneOnce ? 'Рейс прерван экипажем.' : 'Рейс отменён до взлёта.'); };
};
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'flight' && flight && !flight.done && !modal.classList.contains('on')) $('quit').click(); });

function drawReplay(f, k) {
  const cv = $('rcv'); if (!cv) return; const g = cv.getContext('2d'), w = cv.width, h = cv.height, T = f.track, n = T.length;
  g.clearRect(0, 0, w, h);
  const xs = T.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1), hm = Math.max(500, ...T.map(p => p[2])), vm = Math.max(300, ...T.map(p => p[3]));
  const X = x => 30 + (x - x0) / (x1 - x0) * (w - 40), Y = a => h - 18 - a / hm * (h - 34), V = v => h - 18 - v / vm * (h - 34);
  g.strokeStyle = 'rgba(160,255,200,.2)'; g.beginPath(); g.moveTo(30, h - 18); g.lineTo(w - 8, h - 18); g.stroke();
  g.font = '10px sans-serif'; g.fillStyle = '#9fd'; g.fillText(Math.round(hm) + ' м', 2, 12); g.fillStyle = '#fc6'; g.fillText('скорость ' + Math.round(vm) + ' км/ч', w - 110, 12);
  const m = Math.max(1, Math.floor(n * k));
  g.lineWidth = 1.6; g.strokeStyle = '#7dffb0'; g.beginPath(); for (let i = 0; i < m; i++) { const p = T[i]; i ? g.lineTo(X(p[0]), Y(p[2])) : g.moveTo(X(p[0]), Y(p[2])); } g.stroke();
  g.lineWidth = 1; g.strokeStyle = '#fc6'; g.beginPath(); for (let i = 0; i < m; i++) { const p = T[i]; i ? g.lineTo(X(p[0]), V(p[3])) : g.moveTo(X(p[0]), V(p[3])); } g.stroke();
  for (const mk of f.marks) { if (mk.i > m) continue; const p = T[Math.min(mk.i, n - 1)]; g.fillStyle = mk.text === 'Касание' ? '#7dffb0' : '#ff6a6a'; g.beginPath(); g.arc(X(p[0]), Y(p[2]), 4, 0, 6.3); g.fill(); g.fillStyle = '#fff'; g.fillText(mk.text, Math.min(w - 70, X(p[0]) + 5), Math.max(24, Y(p[2]) - 6)); }
  const c = T[m - 1]; g.fillStyle = '#fff'; g.beginPath(); g.arc(X(c[0]), Y(c[2]), 3.5, 0, 6.3); g.fill();
}
function showResult() {
  const f = flight, r = settle(f, contract, { rep: save.rep, copilot: save.copilot });
  const to = f.toAp;
  // применяем итоги
  const drill = !!f.drill;
  const rkBefore = rankOf(save.xp).i;
  if (!drill) {
    save.money = Math.max(0, save.money + r.net);
    if (r.kind !== 'abort') save.flights++;
    if (r.kind === 'ok' || r.kind === 'overrun') { save.loc = f.locAfter; }
    if (r.kind === 'ok') { save.landings++; save.pax += r.pax; if (save.bestSink == null || r.sink < save.bestSink) save.bestSink = r.sink; }
    if (r.kind !== 'abort') {
      const id = f.p.id;
      save.wear[id] = Math.min(100, (save.wear[id] || 0) + (r.km / 60) * (f.flex ? 0.75 : 1) + (r.sink > 2.4 ? 8 : 0) + r.evFail * 5 + (r.kind === 'crash' ? 30 : 0));
      const dr = r.kind === 'ok' ? (r.stars - 3) * 2 + (r.sched > 0 ? 1 : r.sched < 0 ? -2 : 0) : r.kind === 'crash' ? -15 : r.kind === 'overrun' ? -6 : -4;
      r.repD = dr; save.rep = Math.max(0, Math.min(100, save.rep + dr));
      if (save.lease[id] > 0 && !save.owned.includes(id)) { save.lease[id]--; if (!save.lease[id]) { delete save.lease[id]; if (save.plane === id) save.plane = save.owned[0]; } }
    }
    save.xp += r.xp; save.evOk += r.evOk; save.evLate += r.evLate; save.evFail += r.evFail;
    persist();
  }
  const rkAfter = rankOf(save.xp);
  const ttl = drill ? 'Тренировка окончена' : { ok: r.quality, crash: 'Катастрофа', overrun: 'Выкатились за полосу', forced: 'Рейс сорван', missed: 'Аэропорт пролетели', abort: 'Рейс отменён' }[r.kind];
  const row = (a, v, cls) => `<tr><td>${a}</td><td class="${cls || ''}">${v}</td></tr>`;
  let rows = '';
  if (r.kind !== 'abort' && !drill) {
    if (r.kind === 'ok') rows += row('Скорость снижения при касании', r.sink.toFixed(2) + ' м/с');
    if (r.revenue) rows += row('Выручка', '+' + fmtRub(r.revenue), 'pos');
    if (r.kind === 'ok' && r.bonus) rows += row('Бонус за ручное управление', '+' + Math.round(r.bonus * 100) + '%', 'pos');
    if (r.kind === 'ok' && r.pen > 0) rows += row('Штраф за нарушения', '−' + Math.round(r.pen * 100) + '%', 'neg');
    if (r.fuelCost) rows += row('Топливо (' + Math.round(r.fuelUsed) + ' кг)', '−' + fmtRub(r.fuelCost), 'neg');
    if (r.ops) rows += row('Обслуживание', '−' + fmtRub(r.ops), 'neg');
    if (r.fee) rows += row('Аэропортовые сборы', '−' + fmtRub(r.fee), 'neg');
    if (r.kind === 'ok' && r.sched) rows += row('Расписание (' + Math.round(r.tm) + ' мин, план ' + Math.round(r.expMin) + ')', (r.sched > 0 ? '+' : '−') + Math.abs(Math.round(r.sched * 100)) + '%', r.sched > 0 ? 'pos' : 'neg');
    if (r.coFee) rows += row('Второй пилот', '−' + fmtRub(r.coFee), 'neg');
    if (r.repair) rows += row('Ремонт самолёта', '−' + fmtRub(r.repair), 'neg');
    rows += row('<b>Итого</b>', (r.net >= 0 ? '+' : '−') + fmtRub(Math.abs(r.net)), r.net >= 0 ? 'pos' : 'neg');
  }
  if (r.kind === 'abort' && r.evPrem && !drill) rows += row('Премия за верное решение при ЧП', '+' + fmtRub(r.evPrem), 'pos');
  if (r.kind === 'ok' && r.evBonus > 0 && !drill) rows += row('Премия за действия при ЧП', '+' + Math.round(r.evBonus * 100) + '%', 'pos');
  const evTxt = { ok: '✓ отлично', late: '⚠ с опозданием', fail: '✕ провал' };
  const evRows = r.evLog.map(e => `<div class="evrow"><span>${e.title}</span><span class="${e.outcome}">${evTxt[e.outcome]}</span></div>`).join('');
  const inc = f.incidents.map(i => i.text);
  menu.innerHTML = `<div class="panel wide">
    <h1>${ttl}</h1>
    ${r.kind === 'ok' ? `<div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>` : ''}
    ${r.reason ? `<div class="sub">${r.reason}</div>` : ''}
    ${inc.length ? `<div class="sub">Замечания: ${[...new Set(inc)].join(', ')}</div>` : ''}
    ${drill ? '' : `<div class="sub">Репутация: ${Math.round(save.rep)}/100${r.repD ? ' (' + (r.repD > 0 ? '+' : '') + r.repD + ')' : ''} · износ ${f.p.short}: ${wearOf(f.p.id)}%</div>`}
    ${f.track.length > 3 ? '<canvas id="rcv" width="520" height="150" style="width:100%;max-width:520px;background:rgba(8,16,32,.6);border-radius:8px"></canvas><div class="mrow"><button class="btn g" id="bRep">▶ Повтор полёта</button></div>' : ''}
    ${evRows ? `<div class="sub" style="margin-bottom:2px"><b>Аварийные ситуации:</b></div>${evRows}` : ''}
    <table class="res">${rows}</table>
    ${drill ? '' : `<div class="sub">+${r.xp} XP · ${rkAfter.name}${rkAfter.i > rkBefore ? ' — <b style="color:#7dffb0">НОВЫЙ РАНГ!</b>' : ''}</div>`}
    ${drill ? '' : `<div class="row">${stat('💰', fmtRub(save.money))}${stat('📍', apLoc().city)}</div>`}
    <div class="mrow"><button class="btn go" id="bAgain">${drill ? 'Ещё тренировка' : 'Следующий рейс'}</button><button class="btn g" id="bHub">В меню</button></div>
  </div>`;
  mode = 'menu'; ui.classList.remove('on'); menu.classList.add('on');
  drawReplay(f, 1); $('bRep') && ($('bRep').onclick = () => { const t0 = performance.now(), n = f.track.length; const st = () => { const k = Math.min(1, (performance.now() - t0) / 9000); drawReplay(f, k); if (k < 1 && mode === 'menu') requestAnimationFrame(st); }; st(); });
  $('bAgain').onclick = () => setScreen(drill ? 'drill' : 'select');
  $('bHub').onclick = () => setScreen('hub');
  flight = null;
}

// ---------- главный цикл ----------
let lastMsgCount = 0, lastMsgKey = '';
function updateLog() {
  const f = flight, box = $('log');
  const fresh = f.msgs.filter(m => f.time - m.t < 6);
  const key = fresh.map(m => m.t).join(',');
  if (key !== lastMsgKey) { lastMsgKey = key; box.innerHTML = fresh.map(m => `<div>${m.text}</div>`).join(''); }
}
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts; tNow = ts / 1000;
  if (mode === 'flight' && flight) {
    const f = flight;
    if (!paused) {
      keyboardInput(dt);
      if (!f.done) {
        f.c.stick = stick.value; f.c.roll = stick.roll;
        const wasTd = !!f.td, wasAir = f.airborneOnce;
        const w = f.update(dt);
        view.warp = w; view.cam = save.cam;
        if (!wasTd && f.td) { view.bump = Math.min(14, 2 + f.td.sink * 3.5); }
        if (!wasAir && f.airborneOnce) view.bump = 1.5;
        view.bump *= Math.pow(0.02, dt);
        view.turb = (f.h > 20 && f.h < 3500 ? 0.4 : f.h >= 3500 ? 0.15 : 0) + f.fx.turb * 1.6;
        view.rollKick = (view.rollKick || 0) * Math.pow(0.1, dt);
      } else {
        endTimer += dt;
        if (endTimer > 1.6) { showResult(); return; }
      }
    }
    drawFlight(ctx, W, H, f, tNow, view);
    syncButtons(); updateLog(); audioTick(f);
    const h = $('hint'), t = f.assist.hints && !f.done ? f.hint() : '';
    h.style.display = t ? 'block' : 'none'; if (t) h.textContent = t;
    const fd = $('fade');
    if (f.fade > 0) { fd.style.display = 'flex'; fd.style.opacity = Math.min(1, f.fade * 2); fd.textContent = f.fadeText; } else if (fd.style.display !== 'none') fd.style.display = 'none';
    if (f.done && f.result && f.result.kind !== 'ok') { ctx.fillStyle = 'rgba(160,0,0,.25)'; ctx.fillRect(0, 0, W, H); }
  } else {
    const pick = sel ? sel.to : null;
    drawMap(ctx, W, H, ts, { from: save.loc, to: pick, left: 0.02, width: 0.62, top: 0.2, height: 0.55 });
  }
}
requestAnimationFrame(loop);
renderMenu();

// отладка/тесты
window.__pilot = { get flight() { return flight; }, save, startFlight, setScreen, act, get mode() { return mode; } };

return {};
})();
