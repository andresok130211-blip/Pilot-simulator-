    // на заходе скорость такая, чтобы следующая ступень закрылков уже разрешалась
    if (this.dist < 60000 && this.dist > 0) lim = f < 4 ? p.flapLim[f + 1] - 5 : lim;
    return Math.max(Math.min(sched, lim), 1.2 * stallIAS(m, f, p.S));
  }

  apVsCmd(dt) {
    const c = this.c, v = this.v;
    let vsCmd;
    if (this.apprCap) {
      const dd = this.D + AIM_OFFSET - this.x;
      const hGS = glideH(dd);
      const dev = this.h - hGS;
      vsCmd = -v * Math.sin(GS_DEG * DEG) - 0.12 * dev;
      if (this.h < FLARE_H && this.c.gear) vsCmd = -(0.4 + 0.25 * this.h);
      vsCmd = clamp(vsCmd, -9, 3);
      this.dev = dev;
    } else {
      const err = c.apAlt - this.h;
      vsCmd = clamp(0.12 * err, this.emDescent ? -26 : -10, 13);
      if (c.appr && !this.apprCap && this.dist < 40000 && this.dist > 3500 && this.h < 3200 && c.apAlt <= APPR_ALT + 50 && Math.abs(this.yPos) < 500) {
        const gsH = glideH(this.D + AIM_OFFSET - this.x);
        if (this.h > gsH + 40) vsCmd = Math.min(vsCmd, clamp(0.08 * (gsH - 25 - this.h), -8, 0));
      }
      if (vsCmd > 0) {
        const vsCap = (this.Tavail - this.Dr) * v / (this.mass * G);
        vsCmd = Math.min(vsCmd, Math.max(0, 0.85 * vsCap));
        const vmin = 1.18 * stallIAS(this.mass, c.flaps, this.p.S);
        vsCmd = Math.min(vsCmd, Math.max(0, (this.ias - vmin) * 0.6));
        if (this.h + this.elev > this.ceilLim - 200) vsCmd = Math.min(vsCmd, 0);
      } else if (vsCmd < 0) {
        const tIdle = this.Tavail * IDLE;
        const vsIdle = (tIdle - this.Dr) * v / (this.mass * G);
        if (this.emDescent) vsCmd = Math.max(vsCmd, -26 + Math.max(0, this.ias * 1 - 150));
        else if (this.ias > this.atTargetIAS() + 3) vsCmd = Math.max(vsCmd, vsIdle * 0.85);
      }
    }
    // сглаживание
    this.vsCmdS += clamp(vsCmd - this.vsCmdS, -1.6 * dt, 1.6 * dt);
    return this.vsCmdS;
  }

  fpRate(gCmd, extra, rmax) {
    // темп изменения тангажа, чтобы выйти на траекторию gCmd
    const W = this.mass * G;
    const qs = Math.max(this.q * this.p.S, 1) * Math.max(0.6, Math.cos(this.phi));
    const as = this.alphaS;
    const dcl = lerpTab(FLAP_DCL, this.flapAct);
    const aEq = clamp((W * Math.cos(this.gamma) / qs - CL0 - dcl) / CLA, -0.06, as - 0.03);
    const thetaCmd = gCmd + aEq + (extra || 0);
    return clamp(1.2 * (thetaCmd - this.theta), -rmax, rmax);
  }

  // ---------- шаг физики ----------
  step(dt) {
    if (this.done) return;
    const p = this.p, c = this.c;
    this.time += dt; this.simTime += dt;
    this.updateMass();
    this.aero();
    const A = this.A, v = this.v, m = this.mass;
    const ias = this.ias;
    const dist = this.dist;
    if (this.onGround && this.taxiOps) this.groundNav(dt);
    if (this.done) return;
    this.evStep(dt);
    if (this.done) return;

    // актуаторы
    this.gearPos += clamp((c.gear ? 1 : 0) - this.gearPos, -dt / 7, dt / (this.altGear && this.gearPos < 0.98 ? 22 : 7));
    this.flapAct += clamp(c.flaps - this.flapAct, -dt * 0.35, dt * 0.35);

    // помощник: автоматика конфигурации и снижения
    if (!this.onGround) {
      if (this.assist.auto && !this.autoEngaged && this.h > 200 && !c.gear && ias > 1.18 * stallIAS(m, c.flaps, p.S)) {
        c.apOn = true; c.atOn = true; c.nav = true; c.apAlt = this.recAlt; this.autoEngaged = true;
        this.msg('Автопилот включён');
      }
      if (this.assist.auto && c.apOn && !this.autoDescDone && dist < this.todDist() && c.apAlt > APPR_ALT) {
        c.apAlt = APPR_ALT; this.autoDescDone = true; this.msg('Начинаем снижение');
      }
      if (this.assist.auto && c.apOn && dist < 46000 && !c.appr && this.autoDescDone) { c.appr = true; }
      if (this.assist.config && dist < 46000 && dist > 0 && this.h < 3200) {
        this.cfgTimer -= dt;
        if (this.cfgTimer <= 0) {
          this.cfgTimer = 1.2;
          const wantF = dist < 17000 ? 4 : dist < 26000 ? 3 : dist < 34000 ? 2 : dist < 42000 ? 1 : 0;
          if (c.flaps < wantF) this.setFlaps(c.flaps + 1);
          if (!c.gear && dist < 26000) this.setGear(true);
        }
      }
      if (this.assist.config && this.autoEngaged && c.flaps > 0 && dist > 50000 && ias > p.flapLim[c.flaps] * 0.8 + 0 && this.h > 600) {
        // уборка механизации после взлёта по скорости
        this.cfgTimer -= dt;
        if (this.cfgTimer <= 0) { this.cfgTimer = 3; c.flaps = Math.max(0, c.flaps - 1); }
      }
    }

    // захват глиссады
    if (c.appr && c.apOn && !this.apprCap && !this.onGround) {
      const dd = this.D + AIM_OFFSET - this.x;
      if (dist < 46000 && dist > 1500 && Math.abs(this.h - glideH(dd)) < 40 && this.h < 3200 && Math.abs(this.yPos) < 150 && Math.abs(this.psi) < 12 * DEG) { this.apprCap = true; this.msg('Глиссада захвачена'); }
    }
    if (!c.apOn || !c.appr) { if (this.apprCap && !c.apOn) this.apprCap = false; }
    if (this.apprCap && !this.assist.auto && this.h < 45 && c.apOn) { c.apOn = false; this.apprCap = false; this.msg('Автопилот отключён — выравнивайте вручную!'); }
    if (this.onGround) { this.apprCap = false; }

    // автомат тяги
    if (c.atOn && !this.onGround) {
      let tgt = this.atTargetIAS() / Math.sqrt(A.sigma);
      const vdot = clamp(0.25 * (tgt - v), -1.0, 1.0);
      const Treq = this.Dr + m * G * Math.sin(this.gamma) + m * vdot;
      let thr = this.Tavail > 1 ? ((Treq / this.Tavail) - IDLE) / (1 - IDLE) : 0;
      if (this.h < 12 && this.gearPos > 0.9 && c.flaps >= 3) thr = 0;
      c.thr = clamp(thr, 0, 1);
    }
    // тяга
    const spoolUp = 0.4, spoolDn = 0.6;
    this.thrAct += clamp(c.thr - this.thrAct, -spoolDn * dt, spoolUp * dt);
    const T = this.Tavail * (IDLE + (1 - IDLE) * this.thrAct);
    this.T = T;

    // управление тангажем
    let rate = 0;
    const stick = c.stick;
    if (this.onGround) {
      const auth = clamp((ias - 0.6 * this.vr) / (0.35 * this.vr), 0, 1);
      if (stick > 0.04) rate = stick * 3 * DEG * auth;
      else rate = (0 - this.theta) * 1.0; // опускание носа на стойку
      if (this.td && stick <= 0.04) rate = Math.max(-2.5 * DEG, Math.min(rate, 0));
      this.gHold = null;
    } else if (c.apOn) {
      const vsCmd = this.apVsCmd(dt);
      const gCmd = Math.asin(clamp(vsCmd / Math.max(v, 50), -0.3, 0.3));
      const flare = this.apprCap && this.h < FLARE_H;
      rate = this.fpRate(gCmd, (flare ? 0.025 : 0.003) * (vsCmd - this.vs), flare ? 4 * DEG : 3 * DEG);
      this.gHold = null;
    } else if (Math.abs(stick) > 0.04) {
      rate = stick * (stick > 0 ? 3.2 : 2.6) * DEG * clamp((ias - 25) / 40, 0, 1);
      this.gHold = null;
    } else if (this.h > 15) {
      if (this.gHold === null) this.gHold = this.gamma;
      rate = this.fpRate(this.gHold, 0, 3 * DEG);
    } else { rate = 0; this.gHold = null; }

    if (!this.onGround) {
      // защита по углу атаки
      if (this.alpha > this.alphaS - 1 * DEG && rate > 0) rate = 0;
      if (this.alpha > this.alphaS) rate = -3 * DEG;
    }
    this.theta += rate * dt;
    this.theta = clamp(this.theta, this.onGround ? 0 : -15 * DEG, 25 * DEG);
    if (this.onGround && this.theta > 14 * DEG) this.theta = 14 * DEG;
    if (this.onGround && this.theta > 11.7 * DEG && !this.stats.tail) {
      this.stats.tail = true; this.incident('tail', 'Касание хвостом', 6, 999);
    }

    // крен и курс
    if (!this.onGround) {
      const roll = c.roll || 0;
      let phiT = 0;
      if (Math.abs(roll) > 0.04) phiT = roll * 33 * DEG;
      else if (c.apOn && c.nav) {
        const aim = this.D + AIM_OFFSET - this.x;
        let psiC;
        if (dist > 30000) psiC = Math.atan2(-this.yPos, aim);
        else { const lim = (20 + 17 * clamp((Math.abs(this.yPos) - 1500) / 2500, 0, 1)) * DEG; psiC = clamp(-this.yPos * 0.0015, -lim, lim); }
        phiT = clamp(2.5 * wrapPi(psiC - this.psi), -25 * DEG, 25 * DEG);
      }
      this.phi += clamp(phiT - this.phi, -5 * DEG * dt, 5 * DEG * dt);
      this.phi = clamp(this.phi, -35 * DEG, 35 * DEG);
    } else this.phi = 0;

    // топливо
    const flow = 1.6e-5 * T;
    this.fuel = Math.max(0, this.fuel - flow * dt);
    if (this.fuel <= 0 && this.Tavail === 0 && !this.warnings.has('fuel0')) { this.warnings.add('fuel0'); this.msg('Топливо закончилось!'); }

    this.asym = this.eng[1] - this.eng[0];
    if (this.onGround) this.stepGround(dt, T);
    else this.stepAir(dt, T);

    // предупреждения
    this.updateWarnings(dt);
  }

  stepGround(dt, T) {
    const c = this.c, W = this.mass * G;
    const N = Math.max(0, W - this.L);
    const onRwy = this.onRunway(this.x);
    const paved = !this.taxiOps || this.onPaved();
    // режим руления: малая скорость и газ в нижней трети ползунка — ползунок задаёт скорость руления
    const taxiMode = this.taxiOps && this.v < 24 && c.thr < 0.35;
    if (taxiMode) {
      let vt = c.taxiAuto && !(this.td && !this.td.onDest) ? this.autoV : c.thr / 0.35 * 15;
      if (!paved) vt = Math.min(vt, 6);
      let a = c.brake ? -2.6 : clamp((vt - this.v) * 0.7, -1.8, 1.0);
      if (this.gearPos < 0.9) a = Math.min(a, -1);
      this.v = Math.max(0, this.v + a * dt);
      if (this.v < 0.05 && vt < 0.2) this.v = 0;
    } else {
      let mu = paved ? 0.02 : 0.15;
      if (this.gearPos < 0.9) mu = 0.5;
      if (c.brake) mu += onRwy ? 0.30 : 0.2;
      let F = T - this.Dr - mu * N;
      if (this.v < 0.3 && F <= 0) { this.v = 0; }
      else {
        this.v += F / this.mass * dt;
        if (this.v < 0) this.v = 0;
      }
    }
    const steer = this.taxiOps && c.taxiAuto && !(this.td && !this.td.onDest) ? this.autoSteer : (c.roll || 0);
    if (this.taxiOps) {
      if (this.v > 0.8) {
        const sc = Math.abs(steer) > 0.04 ? steer : 0;
        this.psi += sc * Math.min(this.v / 12, 0.7) * (this.v > 30 ? Math.pow(30 / this.v, 2) : 1) * dt;
        if (!sc && onRwy && this.v > 12 && Math.abs(this.psi) < 0.6) this.psi -= this.psi * 0.6 * dt;
      }
    } else if (this.v > 1) {
      if (Math.abs(steer) > 0.04) this.psi += steer * 0.25 * Math.min(1, 25 / Math.max(this.v, 5)) * dt;
      else this.psi -= this.psi * 0.6 * dt;
    }
    if (this.asym && this.v > 3 && !(this.taxiOps && c.taxiAuto)) this.psi -= this.asym * 0.06 * this.thrAct * Math.min(1, this.v / 20) * (this.assist.auto ? 0.35 : 1) * dt;
    this.psi = wrapPi(this.psi);
    this.x += this.v * Math.cos(this.psi) * dt;
    this.yPos += this.v * Math.sin(this.psi) * dt;
    this.gamma = 0; this.h = 0;
    if (this.taxiOps) {
      if (!paved && this.v > 8) this.incident('grass', 'Выезд на траву', 3, 30);
      if (paved && !onRwy && this.v > 20) this.incident('taxispeed', 'Превышение скорости руления', 2, 30);
      for (const f of [this.fr0, this.fr1]) {
        const ax = this.x - f.x0;
        if (this.yPos > 238 && ax > f.len * 0.28 && ax < f.len * 0.65 && this.v > 1) { this.finish('crash', 'Столкновение с терминалом.'); return; }
      }
    }
    // отрыв
    if (!this.td && this.v > 25 && this.L >= W && this.theta > 1.5 * DEG && this.gearPos > 0.5 && (!this.taxiOps || onRwy)) {
      this.onGround = false; this.airborneOnce = true; this.gamma = 0.0; this.h = 0.05;
      this.msg('Отрыв! Скорость ' + Math.round(this.ias * 3.6) + ' км/ч');
      return;
    }
    // заход в траву
    if (!onRwy && this.v > 30 && !this.td && (this.x > this.rwy0.e || Math.abs(this.yPos) > 32)) { this.finish('crash', Math.abs(this.yPos) > 32 ? 'Самолёт выкатился с боковой стороны полосы при взлёте.' : 'Самолёт выкатился за конец полосы при взлёте.'); return; }
    if (!onRwy && this.td && this.v > 25) { this.finish('crash', Math.abs(this.yPos) > 32 ? 'Самолёт выкатился с боковой стороны полосы.' : this.x > this.rwy1.e ? 'Самолёт выкатился за пределы полосы на большой скорости.' : 'Посадка вне полосы на большой скорости.'); return; }
    // автотормоз после касания
    if (this.td && this.assist.auto && this.v > 8 && !(this.taxiOps && c.taxiAuto && this.v < 24)) { c.brake = true; c.thr = 0; c.atOn = false; }
    // конец пробега
    if (this.v > this.maxV) this.maxV = this.v;
    if (this.td && this.v < 0.6 && this.time - this.td.t > 2) {
      const onDest = this.x >= this.rwy1.s - 20 && this.x <= this.rwy1.e + 20 && Math.abs(this.yPos) <= 35;
      if (this.x > this.rwy1.e && Math.abs(this.yPos) < 50) this.finish('overrun', 'Самолёт остановился за пределами полосы.');
      else if (this.taxiOps && this.td.onDest) { /* продолжаем руление до гейта */ }
      else if (onDest) this.finish('ok', '');
      else if (this.x <= this.rwy0.e + 20) this.finish('forced', 'Вынужденная посадка в аэропорту вылета. Рейс отменён.');
      else this.finish('forced', 'Остановились вне полосы назначения.');
    }
    // прерванный взлёт
    if (!this.td && !this.airborneOnce && this.maxV > 25 && this.v < 0.5) this.finish('abort', 'Взлёт прекращён.');
  }

  onRunway(x, y = this.yPos) {
    if (Math.abs(y) > 32) return false;
    return (x >= this.rwy0.s - 5 && x <= this.rwy0.e) || (x >= this.rwy1.s - 5 && x <= this.rwy1.e);
  }

  stepAir(dt, T) {
    const v = Math.max(this.v, 12), m = this.mass;
    const al = this.alpha, ca = Math.cos(al), sa = Math.sin(al);
    const dv = ((T * ca - this.Dr) / m - G * Math.sin(this.gamma)) * dt;
    const dg = ((this.L * Math.cos(this.phi) + T * sa) / (m * v) - G * Math.cos(this.gamma) / v) * dt;
    if (this.v > 20) this.psi = wrapPi(this.psi + G * Math.tan(this.phi) / this.v * dt - this.asym * 0.012 * this.thrAct * (c0apOn(this) ? 0.1 : this.assist.auto ? 0.4 : 1) * dt);
    this.v = Math.max(5, this.v + dv);
    this.gamma = clamp(this.gamma + dg, -1.2, 1.2);
    this.x += this.v * Math.cos(this.gamma) * Math.cos(this.psi) * dt;
    this.yPos += this.v * Math.cos(this.gamma) * Math.sin(this.psi) * dt;
    this.h += this.v * Math.sin(this.gamma) * dt;
    // перегрузка
    const n = this.L / (m * G);
    this.nz = n;
    if (n > this.stats.maxG) this.stats.maxG = n;
    if (this.h < 1500 && this.h > 0.5 && this.airborneOnce && terrainAt(this, this.x, this.yPos) > this.h + 3) { this.finish('crash', 'Столкновение с землёй: самолёт врезался в гору.'); return; }
    if (this.h <= 0 && this.gamma <= 0.02) this.touchdown();
    else if (this.h < 0) this.h = 0;
    // пролетели
    if (!this.done && this.x > this.rwy1.e + 20000 && Math.hypot(this.x - this.D, this.yPos) > 40000) this.finish('missed', 'Вы пролетели аэропорт назначения.');
    if (!this.done && Math.abs(this.yPos) > 70000) this.finish('missed', 'Вы слишком далеко ушли от маршрута.');
  }

  touchdown() {
    const sink = -this.v * Math.sin(this.gamma);
    const tdx = this.x;
    this.h = 0;
    const lat = Math.abs(this.yPos);
    const onDest = tdx >= this.rwy1.s - 10 && tdx <= this.rwy1.e && lat <= 32;
    const onOrig = tdx >= this.rwy0.s && tdx <= this.rwy0.e && lat <= 32;
    const ias = this.ias;
    if (this.gearPos < 0.85) { this.finish('crash', 'Посадка с невыпущенным шасси.'); return; }
    if (this.rwyBlocked && onDest) { this.finish('crash', 'Столкновение с техникой на полосе при посадке.'); return; }
    if (!onDest && !onOrig && this.v > 35) {
      this.finish('crash', lat > 32 ? 'Приземление рядом с полосой: слишком большое боковое отклонение.' : tdx < this.rwy1.s ? 'Недолёт: самолёт приземлился до полосы.' : 'Приземление за пределами полосы.');
      return;
    }
    if (Math.abs(this.phi) > 12 * DEG) { this.finish('crash', 'Касание крылом: слишком большой крен при посадке.'); return; }
    if (Math.abs(this.psi) > 12 * DEG) { this.finish('crash', 'Боковой снос: самолёт приземлился не вдоль полосы.'); return; }
    if (sink > 5.5) { this.finish('crash', 'Слишком жёсткое приземление (' + sink.toFixed(1) + ' м/с): конструкция разрушена.'); return; }
    if (ias * 3.6 > 400) { this.finish('crash', 'Слишком высокая скорость при посадке.'); return; }
    this.onGround = true; this.gamma = 0;
    this.td = { t: this.time, sink: Math.max(0, sink), v: this.v, ias, pitch: this.theta / DEG, x: tdx, onDest, onOrig, past: tdx - this.rwy1.s, lat };
    this.phi = 0;
    if (lat > 12) this.incident('lat', 'Касание не по оси полосы', 2, 999);
    if (this.theta < 0.3 * DEG) this.incident('nose', 'Касание носовой стойкой', 4, 999);
    if (this.theta > 11.7 * DEG && !this.stats.tail) { this.stats.tail = true; this.incident('tail', 'Касание хвостом', 6, 999); }
    if (sink > 3.4) this.incident('hard', 'Жёсткая посадка', 0, 999);
    this.msg(onOrig && !onDest ? 'Вынужденная посадка на аэродроме вылета' : 'Касание: ' + sink.toFixed(1) + ' м/с');
    // вынужденная посадка в аэропорту вылета — сразу завершить рейс после остановки
  }

  updateWarnings(dt) {
    const w = this.warnings;
    const set = (k, on) => { if (on) w.add(k); else w.delete(k); };
    const A = this.A, ias = this.ias;
    set('stall', this.stallWarn);
    if (this.stalled) { this.stats.stallT += dt; this.incident('stall', 'Сваливание', 5, 25); }
    const over = this.mach > this.p.cruiseM + 0.045 || ias > 175;
    set('over', over);
    if (over) { this.stats.overT += dt; if (this.stats.overT > 3) this.incident('over', 'Превышение скорости', 4, 40); }
    const sinkRate = this.vs;
    set('sink', !this.onGround && this.h < 300 && sinkRate < -9 && this.dist < 30000);
    set('pullup', !this.onGround && this.h < 80 && sinkRate < -11);
    set('gear', !this.onGround && this.h < 250 && this.dist < 8000 && this.dist > 0 && !this.c.gear);
    set('flaps', !this.onGround && this.h < 250 && this.dist < 6000 && this.dist > 0 && this.c.flaps < 3 && this.c.gear && !this.hyd);
    this._tw -= dt;
    if (this._tw <= 0) {
      this._tw = 0.5; let th = false;
      if (!this.onGround && this.airborneOnce && this.h < 1800 && !this.ga) {
        const cp = Math.cos(this.psi), sp = Math.sin(this.psi);
        for (const k of [1200, 2600, 4500]) { if (terrainAt(this, this.x + k * cp, this.yPos + k * sp) > this.h - 120 + (this.vs < -2 ? -this.vs * k / Math.max(this.v, 60) * 0.5 : 0)) { th = true; break; } }
      }
      this._terrWarn = th;
    }
    set('terrain', this._terrWarn);
    set('lowfuel', this.fuel < this.p.burnHr * 0.3 && this.fuel > 0);
    if (w.has('sink') || w.has('pullup')) { this.stats.gpws += dt; this.incident('sink', 'Опасная скорость снижения', 3, 30); }
    if (this.fuel <= 0 && this.Tavail === 0) set('fuel0', true);

  finish(kind, reason) {

function drawClouds(pal, f) {
  const base = Math.floor(camX / 6000);
  const list = [];
  for (let ci = base - 1; ci < base + 9; ci++) {
    for (let k = 0; k < 3; k++) {
      const hs = (a) => hash2(ci, k, a);
      if (hs(5) < 0.25) continue;
      const alt = 1700 + hs(2) * 2600 + (hs(8) < 0.2 ? 3500 : 0);
      const size = 450 + hs(3) * 900;
      const X = ci * 6000 + hs(1) * 6000, Z = (hs(4) - 0.5) * 12000;

    }
  }

const yokeUp = e => { if (stick.id === e.pointerId) { stick.id = null; stick.value = 0; stick.roll = 0; setYoke(); } };
yokeEl.addEventListener('pointerup', yokeUp); yokeEl.addEventListener('pointercancel', yokeUp);

// ---------- запасные аэродромы ----------
let altOpen = false, altT = 0;
function toggleAlt(force) {
  altOpen = force !== undefined ? force : !altOpen;
  $('altp').classList.toggle('on', altOpen);
  if (altOpen) { altT = 0; renderAlt(); }
}
function renderAlt() {
  const f = flight; if (!f) return;
  const list = f.altList().slice(0, 5), box = $('altp');
  const arrow = a => { let d = ((a % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI; return `<span style="display:inline-block;transform:rotate(${(d * 180 / Math.PI).toFixed(0)}deg)">➤</span>`; };
  const desc = f.ev ? '<div class="d" style="margin-bottom:4px;color:#ffb3ab">Аварийная ситуация — можно сесть на ближайшем подходящем аэродроме (рейс будет оплачен частично).</div>' : '';
  box.innerHTML = `<h3>Запасные аэродромы</h3>${desc}` + (list.length ? list.map((o, i) => `<div class="it ${o.ok ? 'ok' : 'no'}" data-i="${i}"><div class="ar">${arrow(o.rel)}</div><div><div class="t">${o.label}</div><div class="d">${Math.round(o.d / 1000)} км · ВПП ${o.w.len} м${o.ok ? '' : ' · ' + (o.why || 'сейчас недоступен')}</div></div></div>`).join('') : '<div class="d">Поблизости аэродромов нет.</div>') + '<button class="cl" id="altX">Закрыть</button>';
  box.querySelectorAll('.it.ok').forEach(el => el.onclick = () => { const o = list[+el.dataset.i]; if (o && f.divertTo(o.w)) toggleAlt(false); });
  $('altX').onclick = () => toggleAlt(false);
}

// ---------- кнопки ----------
function act(a) {
  if (!flight || flight.done) return;
  const f = flight, c = f.c;
  switch (a) {
    case 'gear': f.setGear(!c.gear); break;
    case 'fl-': f.setFlaps(c.flaps - 1); break;
    case 'fl+': f.setFlaps(c.flaps + 1); break;
    case 'brake': c.brake = !c.brake; break;
    case 'warp': { const w = [1, 2, 4, 8, 16, 32]; const i = w.indexOf(c.warp); c.warp = w[(i + 1) % w.length]; if (c.warp > f.allowedWarp()) c.warp = 1; if (c.warp === 1 && f.allowedWarp() === 1 && i === 0) f.msg('Ускорение доступно в крейсерском полёте на автопилоте'); break; }
    case 'altp': toggleAlt(); break;
    case 'ext': f.extinguish(); break;
    case 'altgear': f.altGearExt(); break;
    case 'emdesc': f.emergDescent(); break;
    case 'ga': f.goAround(); break;
    case 'ap':
      if (f.apLock > 0) { f.msg('Автопилот неисправен — пилотируйте вручную'); break; }
      if (c.apOn) { c.apOn = false; c.appr = false; f.apprCap = false; c.atOn = false; }
      else if (!f.onGround) { c.apOn = true; c.atOn = true; if (f.h < 3000 && !c.appr) c.apAlt = f.dist < 60000 ? 1500 : f.recAlt; if (f.dist >= 60000) c.apAlt = f.recAlt; }
      break;
    case 'at': if (f.atLock > 0) { f.msg('Автомат тяги неисправен — управляйте газом'); break; } c.atOn = !c.atOn; break;
    case 'nav': c.nav = !c.nav; break;
    case 'taxi': if (f.onGround && f.taxiOps) c.taxiAuto = !c.taxiAuto; break;
    case 'view': save.cam = save.cam === 'chase' ? 'cockpit' : 'chase'; view.cam = save.cam; persist(); break;
    case 'altd': c.apAlt = Math.max(300, c.apAlt - (c.apAlt > 3000 ? 600 : 300)); break;
    case 'altu': c.apAlt = Math.min(f.p.ceiling - 600, c.apAlt + (c.apAlt >= 3000 ? 600 : 300)); break;
    case 'appr': if (f.apLock > 0) { f.msg('Автопилот неисправен'); break; } if (!c.apOn && !f.onGround) { c.apOn = true; c.atOn = true; } c.appr = !c.appr; if (!c.appr) f.apprCap = false; break;
  }
}
ui.querySelectorAll('#btns button, #ebtns button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); act(b.dataset.act); }));

function syncButtons() {
  const f = flight, c = f.c;
  const on = (id, v) => $(id).classList.toggle('on', !!v);
  on('bGear', c.gear); $('bGear').textContent = 'ШАССИ ' + (f.gearPos > 0.98 ? '▼' : f.gearPos < 0.02 ? '▲' : '…');
  $('bFlD').textContent = 'ЗАКР − (' + FLAP_NAMES[c.flaps] + ')'; $('bFlU').textContent = 'ЗАКР +';
  on('bBrake', c.brake); $('bBrake').classList.toggle('warn', c.brake && f.onGround && !f.td && f.v < 1);
  on('bAp', c.apOn); on('bAt', c.atOn); on('bNav', c.nav && c.apOn); on('bTaxi', c.taxiAuto && f.onGround); $('bTaxi').disabled = !f.onGround || !f.taxiOps;
  $('bView').textContent = save.cam === 'chase' ? 'ВИД: СНАРУЖИ' : 'ВИД: КАБИНА'; on('bAppr', c.appr);
  $('bAltD').textContent = 'ВЫС − ' + (c.apOn ? Math.round(c.apAlt) : '');
  $('bAltU').textContent = 'ВЫС +';
  const w = f.effectiveWarp(); $('bWarp').textContent = '×' + c.warp + (w !== c.warp ? ' (' + w + ')' : ''); on('bWarp', c.warp > 1);
  const ev = f.evView(), evp = $('evp');
  if (ev) { evp.style.display = 'block'; const hh = `<b>⚠ ${ev.title}</b>` + ev.steps.map(st => `<div class="${st.done ? 'ok' : 'no'}">${st.done ? '✓' : '•'} ${st.t}</div>`).join(''); if (hh !== evp._h) { evp._h = hh; evp.innerHTML = hh; } }
  else { evp.style.display = 'none'; evp._h = ''; }
  const sh = (id, v) => $(id).classList.toggle('show', !!v);
  sh('eExt', f.fire && !f.fire.ext);
  sh('eGear', f.hyd && !f.altGear);
  sh('eDesc', f.decomp && f.ev && f.ev.id === 'decomp' && !f.emDescent);
  sh('eAlt', !f.onGround && f.airborneOnce && !f.td);
  $('eAlt').classList.toggle('urgent', !!f.ev && f.ev.id !== 'runway' && f.ev.id !== 'apFail' && f.ev.id !== 'atFail');
  if (altOpen) { altT -= 0.016; if (altT <= 0) { altT = 0.7; renderAlt(); } if (f.onGround || f.done) toggleAlt(false); }
  sh('eGa', f.canGoAround() && (f.rwyBlocked || f.dist < 9000));
  $('hint').classList.toggle('alert', !!f.ev);
  if (c.atOn) { $('thrfill').style.height = (c.thr * 100) + '%'; $('thrv').textContent = Math.round(c.thr * 100) + '%'; }
}

// ---------- клавиатура ----------
addEventListener('keydown', e => {
  if (mode !== 'flight' || !flight) return;
  keys[e.code] = true;
  const m = { KeyG: 'gear', KeyF: 'fl+', KeyV: 'fl-', KeyB: 'brake', KeyA: 'ap', KeyT: 'warp', KeyL: 'appr', BracketRight: 'altu', BracketLeft: 'altd', KeyN: 'at', KeyC: 'view', KeyR: 'taxi' }[e.code];
  if (m && !e.repeat) act(m);
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
function keyboardInput(dt) {
  const f = flight;
  let ks = 0, kr = 0;
  if (keys.ArrowUp || keys.KeyW) ks += 1; if (keys.ArrowDown || keys.KeyS) ks -= 1;
  if (keys.ArrowRight || keys.KeyD) kr += 1; if (keys.ArrowLeft) kr -= 1;
  if (ks !== 0 || kr !== 0) { stick.value = ks; stick.roll = kr; setYoke(); keys._kb = true; }
  else if (keys._kb && stick.id === null) { stick.value = 0; stick.roll = 0; setYoke(); keys._kb = false; }
  let dthr = 0; if (keys.ShiftLeft || keys.ShiftRight) dthr += 0.4; if (keys.ControlLeft || keys.ControlRight) dthr -= 0.4;
  if (dthr) thrSet(f.c.thr + dthr * dt);
}

// ---------- выход / завершение ----------
$('quit').onclick = () => {
  if (!flight || flight.done) return;
  paused = true;
  showModal(`<h2>Пауза</h2><div class="sub">Прервать рейс? ${flight.airborneOnce ? 'В воздухе это считается срывом рейса: вы оплатите топливо и обслуживание.' : 'Пока вы на земле, это бесплатно.'}</div>
  <div class="mrow"><button class="btn go" id="mCont">Продолжить</button><button class="btn" style="background:#a23232" id="mQuit">Прервать рейс</button></div>`);
  $('mCont').onclick = () => { paused = false; hideModal(); };
  $('mQuit').onclick = () => { paused = false; hideModal(); flight.finish(flight.airborneOnce ? 'forced' : 'abort', flight.airborneOnce ? 'Рейс прерван экипажем.' : 'Рейс отменён до взлёта.'); };
};
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'flight' && flight && !flight.done && !modal.classList.contains('on')) $('quit').click(); });

function showResult() {
  const f = flight, r = settle(f, contract);
  const to = f.toAp;
  // применяем итоги
  const drill = !!f.drill;
  const rkBefore = rankOf(save.xp).i;
  if (!drill) {
    save.money = Math.max(0, save.money + r.net);
    if (r.kind !== 'abort') save.flights++;
    if (r.kind === 'ok' || r.kind === 'overrun') { save.loc = f.locAfter; }
    if (r.kind === 'ok') { save.landings++; save.pax += r.pax; if (save.bestSink == null || r.sink < save.bestSink) save.bestSink = r.sink; }
    save.xp += r.xp; save.evOk += r.evOk; save.evLate += r.evLate; save.evFail += r.evFail;
    persist();
  }
  const rkAfter = rankOf(save.xp);
  const ttl = drill ? 'Тренировка окончена' : { ok: r.quality, crash: 'Катастрофа', overrun: 'Выкатились за полосу', forced: 'Рейс сорван', missed: 'Аэропорт пролетели', abort: 'Рейс отменён' }[r.kind];
  const row = (a, v, cls) => `<tr><td>${a}</td><td class="${cls || ''}">${v}</td></tr>`;
  let rows = '';
  if (r.kind !== 'abort' && !drill) {
    if (r.kind === 'ok') rows += row('Скорость снижения при касании', r.sink.toFixed(2) + ' м/с');
    if (r.revenue) rows += row('Выручка', '+' + fmtRub(r.revenue), 'pos');
    if (r.kind === 'ok' && r.bonus) rows += row('Бонус за ручное управление', '+' + Math.round(r.bonus * 100) + '%', 'pos');
    if (r.kind === 'ok' && r.pen > 0) rows += row('Штраф за нарушения', '−' + Math.round(r.pen * 100) + '%', 'neg');
    if (r.fuelCost) rows += row('Топливо (' + Math.round(r.fuelUsed) + ' кг)', '−' + fmtRub(r.fuelCost), 'neg');
    if (r.ops) rows += row('Обслуживание', '−' + fmtRub(r.ops), 'neg');
    if (r.fee) rows += row('Аэропортовые сборы', '−' + fmtRub(r.fee), 'neg');
    if (r.repair) rows += row('Ремонт самолёта', '−' + fmtRub(r.repair), 'neg');
    rows += row('<b>Итого</b>', (r.net >= 0 ? '+' : '−') + fmtRub(Math.abs(r.net)), r.net >= 0 ? 'pos' : 'neg');
  }
  if (r.kind === 'abort' && r.evPrem && !drill) rows += row('Премия за верное решение при ЧП', '+' + fmtRub(r.evPrem), 'pos');
  if (r.kind === 'ok' && r.evBonus > 0 && !drill) rows += row('Премия за действия при ЧП', '+' + Math.round(r.evBonus * 100) + '%', 'pos');
  const evTxt = { ok: '✓ отлично', late: '⚠ с опозданием', fail: '✕ провал' };
  const evRows = r.evLog.map(e => `<div class="evrow"><span>${e.title}</span><span class="${e.outcome}">${evTxt[e.outcome]}</span></div>`).join('');
  const inc = f.incidents.map(i => i.text);
  menu.innerHTML = `<div class="panel wide">
    <h1>${ttl}</h1>
    ${r.kind === 'ok' ? `<div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>` : ''}
    ${r.reason ? `<div class="sub">${r.reason}</div>` : ''}
    ${inc.length ? `<div class="sub">Замечания: ${[...new Set(inc)].join(', ')}</div>` : ''}
    ${evRows ? `<div class="sub" style="margin-bottom:2px"><b>Аварийные ситуации:</b></div>${evRows}` : ''}
    <table class="res">${rows}</table>
    ${drill ? '' : `<div class="sub">+${r.xp} XP · ${rkAfter.name}${rkAfter.i > rkBefore ? ' — <b style="color:#7dffb0">НОВЫЙ РАНГ!</b>' : ''}</div>`}
    ${drill ? '' : `<div class="row">${stat('💰', fmtRub(save.money))}${stat('📍', apLoc().city)}</div>`}
    <div class="mrow"><button class="btn go" id="bAgain">${drill ? 'Ещё тренировка' : 'Следующий рейс'}</button><button class="btn g" id="bHub">В меню</button></div>
  </div>`;
  mode = 'menu'; ui.classList.remove('on'); menu.classList.add('on');
  $('bAgain').onclick = () => setScreen(drill ? 'drill' : 'select');
  $('bHub').onclick = () => setScreen('hub');
  flight = null;
}

// ---------- главный цикл ----------
let lastMsgCount = 0, lastMsgKey = '';
function updateLog() {
  const f = flight, box = $('log');
  const fresh = f.msgs.filter(m => f.time - m.t < 6);
  const key = fresh.map(m => m.t).join(',');
  if (key !== lastMsgKey) { lastMsgKey = key; box.innerHTML = fresh.map(m => `<div>${m.text}</div>`).join(''); }
}
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts; tNow = ts / 1000;
  if (mode === 'flight' && flight) {
    const f = flight;
    if (!paused) {
      keyboardInput(dt);
      if (!f.done) {
        f.c.stick = stick.value; f.c.roll = stick.roll;
        const wasTd = !!f.td, wasAir = f.airborneOnce;
        const w = f.update(dt);
        view.warp = w; view.cam = save.cam;
        if (!wasTd && f.td) { view.bump = Math.min(14, 2 + f.td.sink * 3.5); }
        if (!wasAir && f.airborneOnce) view.bump = 1.5;
        view.bump *= Math.pow(0.02, dt);
        view.turb = f.h > 20 && f.h < 3500 ? 0.4 : f.h >= 3500 ? 0.15 : 0;
        view.rollKick = (view.rollKick || 0) * Math.pow(0.1, dt);
      } else {
        endTimer += dt;
        if (endTimer > 1.6) { showResult(); return; }
      }
    }
    drawFlight(ctx, W, H, f, tNow, view);
    syncButtons(); updateLog(); audioTick(f);
    const h = $('hint'), t = f.assist.hints && !f.done ? f.hint() : '';
    h.style.display = t ? 'block' : 'none'; if (t) h.textContent = t;
    const fd = $('fade');
    if (f.fade > 0) { fd.style.display = 'flex'; fd.style.opacity = Math.min(1, f.fade * 2); fd.textContent = f.fadeText; } else if (fd.style.display !== 'none') fd.style.display = 'none';
    if (f.done && f.result && f.result.kind !== 'ok') { ctx.fillStyle = 'rgba(160,0,0,.25)'; ctx.fillRect(0, 0, W, H); }
  } else {
    const pick = sel ? sel.to : null;
    drawMap(ctx, W, H, ts, { from: save.loc, to: pick, left: 0.02, width: 0.62, top: 0.2, height: 0.55 });
  }
}
requestAnimationFrame(loop);
renderMenu();

// отладка/тесты
window.__pilot = { get flight() { return flight; }, save, startFlight, setScreen, act, get mode() { return mode; } };

return {};
})();
</script>
