<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Pilot Sim — Пилот авиалайнера</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="thr" class="ctl"><div id="thrfill"></div><div id="thrmark"><span>ВЗЛЁТ ▲</span><span>▼ РУЛЕНИЕ</span></div><div class="lb">ГАЗ</div><div id="thrv">0%</div></div>
  <div id="yoke" class="ctl"><svg id="yokeSvg" viewBox="-100 -100 200 200"><g id="yokeG">
    <rect x="-9" y="8" width="18" height="86" rx="8" fill="#2b3242"/>
    <path d="M-80 -52 L-80 -6 Q-80 26 -48 26 L48 26 Q80 26 80 -6 L80 -52" fill="none" stroke="#10141c" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-80 -52 L-80 -6 Q-80 26 -48 26 L48 26 Q80 26 80 -6 L80 -52" fill="none" stroke="#8b96ad" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-80" cy="-52" r="8" fill="#ffc247"/><circle cx="80" cy="-52" r="8" fill="#ffc247"/>
    <circle r="19" fill="#202737" stroke="#aab4c8" stroke-width="3"/><path d="M0 -10 L0 -26" stroke="#ffc247" stroke-width="5" stroke-linecap="round"/>
  </g></svg><div class="yl">ШТУРВАЛ</div></div>
  <div id="btns">
    <button id="bGear" data-act="gear">ШАССИ</button>
    <button id="bFlD" data-act="fl-">ЗАКР −</button>
    <button id="bFlU" data-act="fl+">ЗАКР +</button>
    <button id="bBrake" data-act="brake">ТОРМОЗ</button>
    <button id="bWarp" data-act="warp">×1</button>
    <button id="bAp" data-act="ap">А/П</button>
    <button id="bAt" data-act="at">А/Т</button>
    <button id="bNav" data-act="nav">НАВ</button>
    <button id="bAltD" data-act="altd">ВЫС −</button>
    <button id="bAltU" data-act="altu">ВЫС +</button>
    <button id="bAppr" data-act="appr">ПОСАДКА</button>
    <button id="bTaxi" data-act="taxi">АВТО РУЛ</button>
    <button id="bView" data-act="view">ВИД</button>
  </div>
  <div id="hint"></div>
  <div id="log"></div>
  <button id="quit" class="ctl">✕</button>
</div>

<div id="menu" class="screen on"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="rot">Поверните телефон горизонтально ↻</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
